name: Validate Port
on:
  push:
    branches: [tmp-sha]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-multichain-address-validator
          fetch-depth: 2
      - name: Bootstrap and Validate
        run: |
          ./bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg format-manifest ports/multichain-address-validator/vcpkg.json
          echo '=== FORMAT_DIFF ==='
          git diff ports/multichain-address-validator/vcpkg.json
          echo '=== INSTALL ==='
          ./vcpkg install multichain-address-validator
          echo '=== PORT_TREE ==='
          git rev-parse HEAD:ports/multichain-address-validator
          echo '=== X_ADD_VERSION ==='
          ./vcpkg x-add-version multichain-address-validator --verbose
          echo '=== VERSION_FILE ==='
          cat versions/m-/multichain-address-validator.json
          echo '=== BASELINE_DIFF ==='
          git diff versions/baseline.json
